<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f3efe8;color:#000}
.p {font-style: cursive;}

.hero {
  width: 100%;
  margin: 0;
  padding: 0;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  /* 🔥 BG IMAGE */
  background: url('./sachin-banner.png') center/cover no-repeat;
  position: relative;
}
 
.video-grid {
  padding: 40px 20px;
  background: #fff;
}

.vg-wrapper {
  overflow: hidden;
}

/* DESKTOP GRID */
.vg-track {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.vg-item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
}

.vg-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* MOBILE CAROUSEL */
@media (max-width: 768px) {
  .hero {
    min-height: 32vh;
  }
  .vg-track {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .vg-track::-webkit-scrollbar {
    display: none;
  }

  .vg-item {
    min-width: 80%;
    scroll-snap-align: start;
  }
}
.contact-section {
  padding: 80px 60px 40px;
  color: #fff;
  background: linear-gradient(135deg, #676b77, #000000);
  position: relative;
  overflow: hidden;
}

/* subtle diagonal overlay */
.contact-section::after {
  content: "";
  position: absolute;
  top: -20%;
  right: -10%;
  width: 60%;
  height: 150%;
  background: rgba(255,255,255,0.05);
  transform: rotate(25deg);
}

/* layout */
.cs-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 40px;
}

.cs-left h2 {
  font-size: 64px;
  margin-bottom: 20px;
  font-weight: 600;
}

.cs-left p {
  font-size: 22px;
  opacity: 0.8;
  line-height: 1.6;
}

/* icons */
.cs-right {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  gap: 20px;
}

/* ICON BASE */
.cs-icon {
  height: 80px;
  width: 80px;
  border: 1px solid rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  border-radius: 12px;
  color: #fff;
  text-decoration: none;
  backdrop-filter: blur(6px);
  transition: all 0.35s ease;
  position: relative;
}

/* ✨ IDLE FLOAT (each icon slightly different timing) */
.cs-icon:nth-child(1) { animation: float1 6s ease-in-out infinite; }
.cs-icon:nth-child(2) { animation: float2 7s ease-in-out infinite; }
.cs-icon:nth-child(3) { animation: float3 5.5s ease-in-out infinite; }
.cs-icon:nth-child(4) { animation: float2 6.5s ease-in-out infinite; }
.cs-icon:nth-child(5) { animation: float1 7.5s ease-in-out infinite; }

/* floating keyframes */
@keyframes float1 {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

@keyframes float2 {
  0% { transform: translateY(0px); }
  50% { transform: translateY(8px); }
  100% { transform: translateY(0px); }
}

@keyframes float3 {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}

/* 🚀 HOVER EFFECT */
.cs-icon:hover {
  transform: translateY(-12px) scale(1.05);
  background: rgba(255,255,255,0.2);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* ✨ glow pulse */
.cs-icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: radial-gradient(circle, rgba(255,255,255,0.25), transparent);
  opacity: 0;
  transition: 0.4s;
}

.cs-icon:hover::after {
  opacity: 1;
}

/* bottom */
.cs-bottom {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.3);
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  opacity: 0.8;
}

.cs-bottom span {
  text-decoration: underline;
}

/* MOBILE */
@media (max-width: 768px) {
  .cs-container {
    flex-direction: column;
    align-items: flex-start;
  }

  .cs-left h2 {
    font-size: 40px;
  }

  .cs-left p {
    font-size: 12px;
  }

  .cs-right {
    grid-template-columns: repeat(3, 60px);
  }

  .cs-icon {
    height: 60px;
    width: 60px;
    font-size: 20px;
  }

  .cs-bottom {
    flex-direction: column;
    gap: 10px;
  }
}
.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.4s ease;
  z-index: 999;
}

.theme-toggle svg {
  position: absolute;
  transition: 0.4s ease;
  top: -11px;
  left: -12px;
}

/* default */
.sun { opacity: 1; transform: rotate(0deg) scale(1); }
.moon { opacity: 0; transform: rotate(90deg) scale(0.5); }

/* DARK MODE ICON SWITCH */
body.dark .sun {
  opacity: 0;
  transform: rotate(-90deg) scale(0.5);
}

body.dark .moon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}
body {
  transition: background 0.4s ease, color 0.4s ease;
}

/* DARK MODE */
body.dark {
  background: #0e0e0e;
  color: #fff;
}

/* Sections */
body.dark .hero {
  background: #111;
}

body.dark .video-grid {
  background: #0e0e0e;
}

body.dark .contact-section {
  background: linear-gradient(135deg, #111, #000);
}

/* toggle button */
body.dark .theme-toggle {
  background: #1a1a1a;
}
body {
  transition: all 0.5s ease;
}
/* TYPEWRITER */
.typewriter {
  display: inline-block;
  font-weight: 700;
  background: linear-gradient(90deg,#7b2ff7,#f107a3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid #000;

  width: 0;
  animation: typing 2.5s steps(14, end) forwards,
             blink 0.7s infinite;
}

/* typing effect */
@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

/* cursor blink */
@keyframes blink {
  50% { border-color: transparent }
}

/* DARK MODE cursor fix */
body.dark .typewriter {
  border-right: 2px solid #fff;
}
.btn-click {
    background: #56565e;
    color: #fff;
    text-decoration: none;
    margin: 10px;
    text-transform: uppercase;
    font-size: 1rem;
}
</style>
</head>
