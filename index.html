<!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f3efe8;color:#000}
.p {font-style: cursive;}
.a {color: unset !important;
   text-decoration: none !important;
   }
.hero {
  width: 100%;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url('./sachin-banner.png') center/cover no-repeat;
  position: relative;
}

/* ─── VIDEO SWIPER SECTION ─── */
.video-grid {
  padding: 50px 20px;
  background: #fff;
}

.swiper {
  width: 100%;
  padding-bottom: 48px !important; /* space for pagination */
}

.swiper-slide {
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}

.swiper-slide video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 20px;
}

/* ─── CUSTOM PAGINATION DOTS ─── */
.swiper-pagination-bullet {
  width: 8px;
  height: 8px;
  background: #bbb;
  opacity: 1;
  transition: all 0.3s ease;
}

.swiper-pagination-bullet-active {
  background: #000;
  width: 24px;
  border-radius: 4px;
}

/* ─── CUSTOM NAV ARROWS ─── */
.swiper-button-next,
.swiper-button-prev {
  color: #000;
  background: rgba(255,255,255,0.85);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
}

.swiper-button-next::after,
.swiper-button-prev::after {
  font-size: 16px;
  font-weight: 700;
}

.swiper-button-next:hover,
.swiper-button-prev:hover {
  background: #000;
  color: #fff;
}

body.dark .swiper-button-next,
body.dark .swiper-button-prev {
  background: rgba(30,30,30,0.85);
  color: #fff;
}

body.dark .swiper-pagination-bullet { background: #555; }
body.dark .swiper-pagination-bullet-active { background: #fff; }

/* ─── MOBILE ─── */
@media (max-width: 768px) {
  .hero { min-height: 32vh; }

  .swiper-button-next,
  .swiper-button-prev { display: none; }
}

/* ─── CONTACT ─── */
.contact-section {
  padding: 80px 60px 40px;
  color: #fff;
  background: linear-gradient(135deg, #676b77, #000000);
  position: relative;
  overflow: hidden;
}
.contact-section::after {
  content: "";
  position: absolute;
  top: -20%;
  right: -10%;
  width: 60%;
  height: 150%;
  background: rgba(255,255,255,0.05);
  transform: rotate(25deg);
}
.cs-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 40px;
}
.cs-left h2 { font-size: 64px; margin-bottom: 20px; font-weight: 600; }
.cs-left p  { font-size: 22px; opacity: 0.8; line-height: 1.6; }

.cs-right {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  gap: 20px;
}
.cs-icon {
  height: 80px; width: 80px;
  border: 1px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; border-radius: 12px;
  color: #fff; text-decoration: none;
  backdrop-filter: blur(6px);
  transition: all 0.35s ease;
  position: relative;
}
.cs-icon:nth-child(1) { animation: float1 6s ease-in-out infinite; }
.cs-icon:nth-child(2) { animation: float2 7s ease-in-out infinite; }
.cs-icon:nth-child(3) { animation: float3 5.5s ease-in-out infinite; }
.cs-icon:nth-child(4) { animation: float2 6.5s ease-in-out infinite; }
.cs-icon:nth-child(5) { animation: float1 7.5s ease-in-out infinite; }
@keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)}  }
@keyframes float3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.cs-icon:hover {
  transform: translateY(-12px) scale(1.05);
  background: rgba(255,255,255,0.2);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}
.cs-icon::after {
  content:""; position:absolute; inset:0; border-radius:12px;
  background:radial-gradient(circle, rgba(255,255,255,0.25), transparent);
  opacity:0; transition:0.4s;
}
.cs-icon:hover::after { opacity:1; }
.cs-bottom {
  margin-top: 60px; padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.3);
  display: flex; justify-content: space-between;
  font-size: 16px; opacity: 0.8;
}
.cs-bottom span { text-decoration: underline; }

/* ─── DARK MODE ─── */
body { transition: background 0.4s ease, color 0.4s ease; }
body.dark { background: #0e0e0e; color: #fff; }
body.dark .video-grid { background: #0e0e0e; }
body.dark .contact-section { background: linear-gradient(135deg, #111, #000); }
body.dark .theme-toggle { background: #1a1a1a; }

/* ─── THEME TOGGLE ─── */
.theme-toggle {
  position: fixed; top: 20px; right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: #fff; display: flex;
  align-items: center; justify-content: center;
  cursor: pointer; transition: 0.4s ease; z-index: 999;
}
.theme-toggle svg { position:absolute; transition:0.4s ease; top:-11px; left:-12px; }
.sun { opacity:1; transform:rotate(0deg) scale(1); }
.moon{ opacity:0; transform:rotate(90deg) scale(0.5); }
body.dark .sun  { opacity:0; transform:rotate(-90deg) scale(0.5); }
body.dark .moon { opacity:1; transform:rotate(0deg) scale(1); }

/* ─── TYPEWRITER ─── */
.typewriter {
  display: inline-block; font-weight: 700;
  background: linear-gradient(90deg,#7b2ff7,#f107a3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  overflow: hidden; white-space: nowrap;
  border-right: 2px solid #000;
  width: 0;
  animation: typing 2.5s steps(14, end) forwards, blink 0.7s infinite;
}
@keyframes typing { from{width:0} to{width:100%} }
@keyframes blink  { 50%{border-color:transparent} }
body.dark .typewriter { border-right: 2px solid #fff; }

/* ─── BUTTONS ─── */
.btn-click {
  background: #000; color: #fff;
  padding: 4px 12px; text-decoration: none;
  border-radius: 0.4rem; margin: 10px;
  text-transform: uppercase; font-size: 1rem;
  box-shadow: rgba(17,17,26,0.1) 0px 4px 16px,
              rgba(17,17,26,0.1) 0px 8px 24px,
              rgba(17,17,26,0.1) 0px 16px 56px;
}
.nyc-btn {
  display: flex; align-items: center; justify-content: space-evenly;
}

/* ─── MOBILE CONTACT ─── */
@media (max-width: 768px) {
  .cs-container { flex-direction: column; align-items: flex-start; }
  .cs-left h2  { font-size: 40px; }
  .cs-left p   { font-size: 12px; }
  .cs-right    { grid-template-columns: repeat(3, 60px); }
  .cs-icon     { height: 60px; width: 60px; font-size: 20px; }
  .cs-bottom   { flex-direction: column; gap: 10px; }
}
</style>
</head>

<script>
  // ─── INIT SWIPER ───
  const swiper = new Swiper('.videoSwiper', {
    loop: true,
    grabCursor: true,
    centeredSlides: true,
    spaceBetween: 20,

    // Show peek of next/prev slides
    breakpoints: {
      0: {
        slidesPerView: 1.15,
        spaceBetween: 12,
      },
      600: {
        slidesPerView: 2.2,
        spaceBetween: 16,
      },
      1024: {
        slidesPerView: 3.2,
        spaceBetween: 20,
      },
      1400: {
        slidesPerView: 3.8,
        spaceBetween: 24,
      }
    },

    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },

    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },

    autoplay: {
      delay: 3500,
      disableOnInteraction: false,
      pauseOnMouseEnter: true,
    },
  });

  // ─── PLAY VIDEOS ───
  document.querySelectorAll("video").forEach(v => v.play().catch(() => {}));

  // ─── DARK MODE ───
  document.getElementById("themeToggle").addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });
</script>
